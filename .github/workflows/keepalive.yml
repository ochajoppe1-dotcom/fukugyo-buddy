name: Supabase keepalive

# 無料プランの Supabase は「7日間 DB 無アクセス」で自動停止する。
# 毎日本番の /api/health を叩いて DB に触れさせ、停止を防ぐ。
# ※3日おき運用中の2026-07-09にSupabaseから「活動不足・pause予告」メールが来たため毎日に強化。
on:
  schedule:
    - cron: "0 3 * * *" # 毎日 03:00 UTC（=日本時間12:00）
  workflow_dispatch: {} # 手動実行も可能

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production health endpoint
        run: |
          echo "Pinging health endpoint..."
          code=$(curl -fsS --max-time 30 -o /tmp/health.json -w "%{http_code}" \
            https://fukugyo-buddy.vercel.app/api/health) || {
              echo "curl failed"; cat /tmp/health.json 2>/dev/null; exit 1;
            }
          echo "HTTP $code"
          cat /tmp/health.json
          test "$code" = "200"
